<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>This is the pratices for DOM manipulation</title>
</head>
<body style="background-color: #212121;color: #fff;">
    <ul class="language">
        <li>JavaScript</li>
        <li>Python</li>
        <li>Java</li>
    </ul>
</body>
<script>
    function addLanguage(lang){
        const li = document.createElement('li')
        li.innerHTML = `${lang}`
        document.querySelector('.language').appendChild(li)
    }
    addLanguage('C++')
    function optimize(lang){
        const li = document.createElement('li')
        li.appendChild(document.createTextNode(lang))
        document.querySelector('.language').appendChild(li)
    }
    optimize('Ruby')

    //Edit

    const secondItem = document.querySelector("li:nth-child(2)")
    // secondItem.innerHTML = "Python (Edited)" -->This is good but this is not optimized
    const newLi = document.createElement('li')
    newLi.textContent = "Python (Edited)"
    secondItem.replaceWith(newLi)

    const firstItem = document.querySelector("li:first-child")
    firstItem.outerHTML = '<li>C (Edited)</li>'

    //Remove

    const lastItem = document.querySelector("li:last-child")
    lastItem.remove()
</script>
</html>
